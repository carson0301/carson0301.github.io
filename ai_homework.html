<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>學生點名與分數追蹤器</title>
    <!-- 載入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 載入 SheetJS 函式庫：用於直接解析 XLSX 檔案 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* 使用 Inter 字體 */
        html { font-family: 'Inter', sans-serif; }
        
        /* 美化背景：改為淺色主題，並啟用 3D 視角 */
        body {
            background: #f8f8f8; /* 改為非常淺的灰色，幾乎是白色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 3rem;
            padding-bottom: 3rem;
            position: relative;
            /* 允許頁面捲動 */
        }
        
        /* 粒子容器 - 固定在背景，不影響主內容 */
        #particle-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0; /* 確保在最底層 */
            pointer-events: none; /* 讓滑鼠點擊穿透到下層元素 */
            perspective: 1000px; /* 增加 3D 效果，讓視角更深邃 */
            /* 允許內容在 3D 空間中移動 */
            transform-style: preserve-3d; 
        }

        /* 單個粒子樣式 - 現在由 JS 控制位置和顏色，只保留閃爍動畫 */
        .particle {
            position: absolute;
            /* 移除固定的白色背景，由 JS 注入隨機顏色 */
            border-radius: 50%;
            /* 移除陰影，使其在淺色背景下更自然 */
            
            /* 只保留閃爍動畫，時長和延遲由 JS 設置的變數控制 */
            animation: 
                twinkle var(--twinkle-duration) ease-in-out var(--animation-delay) infinite;
            /* 增加過渡效果，讓 JS 改變 transform 時更平滑 */
            transition: transform 0.15s linear; 
        }

        /* 粒子閃爍動畫：改變透明度 */
        @keyframes twinkle {
            0%, 100% { opacity: 0.8; }
            50% { opacity: 0.2; }
        }

        /* 確保主容器浮動在粒子上方 */
        #app-container {
            /* 調整主容器背景為純白，與背景 #f8f8f8 略有區別 */
            background-color: white; 
        }
    </style>
</head>
<body>

<!-- 新增粒子效果容器 -->
<div id="particle-container"></div>

<div id="app-container" class="w-full max-w-4xl mx-4 bg-white shadow-2xl rounded-2xl p-6 md:p-10 border border-gray-100 relative z-10"> <!-- 確保 z-10 在粒子上方 -->

    <h1 class="text-3xl font-bold text-gray-800 mb-6 text-center">學生點名與分數追蹤</h1>

    <!-- 狀態和控制區塊 -->
    <div id="control-panel" class="mb-8 p-4 bg-indigo-50 rounded-xl flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0 md:space-x-4">
        <div class="flex items-center space-x-2">
            <span id="class-status-icon" class="text-2xl"></span>
            <span id="class-status-text" class="text-lg font-semibold text-gray-700">尚未開始上課</span>
        </div>
        
        <div class="flex space-x-3 w-full md:w-auto">
            <button id="start-class-btn" onclick="startClass()" class="flex-1 w-full md:w-auto px-6 py-2 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition duration-300 transform hover:scale-105" disabled>
                <i data-lucide="play"></i> 上課
            </button>
            <button id="end-class-btn" onclick="endClass()" class="flex-1 w-full md:w-auto px-6 py-2 bg-red-600 text-white font-semibold rounded-lg shadow-md hover:bg-red-700 transition duration-300 transform hover:scale-105" disabled>
                <i data-lucide="square"></i> 下課 (儲存分數)
            </button>
        </div>
    </div>

    <!-- 檔案上傳與學生名單 -->
    <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border border-indigo-200">
        <h2 class="text-xl font-semibold text-gray-700 mb-3 flex items-center">
            <i data-lucide="upload-cloud" class="w-5 h-5 mr-2 text-indigo-500"></i>
            學生名單上傳 (僅接受 .xlsx 檔案)
        </h2>
        <!-- 檔案輸入只接受 .xlsx 格式 -->
        <input type="file" id="file-input" accept=".xlsx" onchange="handleFileUpload(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer">
        <p id="student-count" class="mt-3 text-sm text-gray-500">已載入 0 位學生。</p>
    </div>

    <!-- 點名和分數追蹤介面 -->
    <div id="main-interface" class="bg-white p-6 rounded-xl shadow-lg border border-indigo-200 opacity-50 pointer-events-none transition-opacity duration-300">
        <h2 class="text-xl font-semibold text-gray-700 mb-4 flex items-center">
            <i data-lucide="dice-5" class="w-5 h-5 mr-2 text-indigo-500"></i>
            隨機點名
        </h2>
        
        <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0 md:space-x-4 mb-6">
            <button id="select-student-btn" onclick="randomSelectStudent()" class="w-full md:w-1/2 px-8 py-3 bg-indigo-600 text-white text-lg font-bold rounded-xl shadow-lg hover:bg-indigo-700 transition duration-300 transform hover:scale-105 disabled:bg-indigo-400 disabled:cursor-not-allowed" disabled>
                <i data-lucide="sparkles" class="w-5 h-5 inline mr-2"></i> 抽取學生
            </button>
            <div class="w-full md:w-1/2 text-center p-4 bg-yellow-100 rounded-xl border border-yellow-300">
                <p class="text-sm text-gray-600 mb-1">目前被抽中的學生:</p>
                <p id="current-student" class="text-3xl font-extrabold text-indigo-800 transition-all duration-500 ease-in-out">...</p>
            </div>
        </div>

        <!-- 分數控制 -->
        <div class="p-5 border border-dashed border-gray-300 rounded-xl bg-gray-50">
            <p class="text-center text-md font-medium text-gray-600 mb-3">回答問題分數控制</p>
            <div id="score-controls" class="flex justify-center space-x-4">
                <button id="add-score-btn" onclick="updateScore(1)" class="px-5 py-3 bg-teal-500 text-white text-xl font-bold rounded-full shadow-lg hover:bg-teal-600 transition duration-300 transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="plus-circle" class="w-6 h-6 inline"></i> 加一分
                </button>
                <button id="minus-score-btn" onclick="updateScore(-1)" class="px-5 py-3 bg-orange-500 text-white text-xl font-bold rounded-full shadow-lg hover:bg-orange-600 transition duration-300 transform hover:scale-105 disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                    <i data-lucide="minus-circle" class="w-6 h-6 inline"></i> 扣一分
                </button>
            </div>
            <p id="current-score-display" class="mt-4 text-center text-2xl font-bold text-gray-700">目前分數: <span class="text-teal-600">0</span></p>
        </div>
        
        <!-- 分數列表 -->
        <h3 class="text-lg font-semibold text-gray-700 mt-6 mb-3 border-b pb-2">本節課分數記錄 (需 <span class="text-red-500">上課</span> 後才顯示)</h3>
        <div id="scores-list" class="space-y-2 max-h-64 overflow-y-auto p-2 bg-gray-50 rounded-lg">
            <p class="text-gray-500 text-center text-sm">請先點擊「上課」按鈕開始。</p>
        </div>
    </div>

    <!-- 訊息提示區塊 -->
    <div id="message-box" class="fixed bottom-4 right-4 p-3 bg-blue-500 text-white rounded-lg shadow-xl hidden transition-opacity duration-300 opacity-0"></div>

</div>

<!-- 粒子效果初始化腳本 (使用純 JS 產生粒子) -->
<script>
    // 增加粒子數量，讓星空更密集
    const NUM_PARTICLES = 250; 
    let mousePos = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    let center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
    const particles = []; // 儲存所有粒子 DOM 元素

    function initParticles() {
        const container = document.getElementById('particle-container');
        if (!container) return;
        
        container.innerHTML = '';
        
        for (let i = 0; i < NUM_PARTICLES; i++) {
            particles.push(createParticle(container));
        }
        
        // 設定滑鼠移動監聽器
        window.addEventListener('mousemove', (e) => {
            mousePos = { x: e.clientX, y: e.clientY };
        });

        // 重新計算中心點（如果視窗大小改變）
        window.addEventListener('resize', () => {
            center = { x: window.innerWidth / 2, y: window.innerHeight / 2 };
        });

        // 啟動粒子動畫循環
        animateParticles();
    }

    /** Helper function to get a random vibrant color in HSL format */
    function getRandomColor() {
        // H: 0-360 (所有顏色)
        const hue = Math.floor(Math.random() * 360); 
        // S: 70-100% (高飽和度，確保顏色鮮豔)
        const saturation = Math.floor(Math.random() * 30) + 70;
        // L: 40-60% (中等亮度，確保在白色背景上可見)
        const lightness = Math.floor(Math.random() * 20) + 40; 
        return `hsl(${hue}, ${saturation}%, ${lightness}%)`;
    }

    function createParticle(container) {
        const particle = document.createElement('div');
        particle.className = 'particle';

        // 設定隨機顏色
        particle.style.background = getRandomColor();

        // 隨機靜態樣式
        const size = Math.random() * 2 + 1; // 1px to 3px
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        
        // 隨機位置 (vw/vh) - 設定為初始位置
        const x = Math.random() * 100; // 0 to 100 vw
        const y = Math.random() * 100; // 0 to 100 vh
        
        // 隨機 Z 軸位移 (深度)
        // 範圍擴大到 -200 (遠) 到 200 (近)，以增加視差效果
        const z = Math.random() * 400 - 200; 

        // 設置初始位置 (vw/vh)
        particle.style.left = `${x}vw`;
        particle.style.top = `${y}vh`;

        // 將深度和初始縮放儲存到 dataset
        particle.dataset.z = z; 
        
        // 根據深度計算初始縮放
        const scaleFactor = 1 - (z / 400); // 假設最遠-200，最近200，400是範圍
        particle.dataset.initialScale = size * scaleFactor;

        // 初始 Transform 只需要 Z 軸深度和縮放
        particle.style.transform = `translateZ(${z}px) scale(${size * scaleFactor})`;

        // 隨機閃爍動畫參數 (保留)
        const twinkleDuration = Math.random() * 3 + 2; // 2s to 5s for twinkle
        const delay = Math.random() * 15; // 0s to 15s delay

        // 將隨機值設置為 CSS 變量
        particle.style.setProperty('--twinkle-duration', `${twinkleDuration}s`);
        particle.style.setProperty('--animation-delay', `${delay}s`);

        container.appendChild(particle);
        return particle;
    }

    /** 動畫循環：讓粒子跟隨滑鼠移動 */
    function animateParticles() {
        // 計算滑鼠相對於中心點的偏移 (像素值)
        const dx = mousePos.x - center.x; // X 偏移
        const dy = mousePos.y - center.y; // Y 偏移
        
        particles.forEach(particle => {
            const z = parseFloat(particle.dataset.z);
            const initialScale = parseFloat(particle.dataset.initialScale);

            // 深度 Z 影響移動速度（視差效果）
            // 越遠 (z 負值越大) 移動越慢，越近 (z 正值越大) 移動越快
            // 這裡使用 400 作為基準深度
            const parallaxFactor = z / 400; 
            
            // 讓粒子向滑鼠移動的反方向平移 (例如，滑鼠向右，背景向左移動)，創造景深錯覺
            // 乘以較小的係數 (e.g., 0.05) 來限制移動幅度
            const moveX = -dx * parallaxFactor * 0.05;
            const moveY = -dy * parallaxFactor * 0.05;
            
            // 更新 transform：包含 X/Y 平移、Z 軸深度和平滑縮放
            particle.style.transform = `translate(${moveX}px, ${moveY}px) translateZ(${z}px) scale(${initialScale})`;
        });

        requestAnimationFrame(animateParticles);
    }
    
    // 將粒子初始化掛載到 DOMContentLoaded
    document.addEventListener('DOMContentLoaded', initParticles);
</script>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 設定 Firestore Log 等級，方便開發除錯
    setLogLevel('Debug');

    // 全域變數初始化，從 Canvas 環境讀取
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
    const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // 應用程式狀態 (State)
    window.app = null;
    window.db = null;
    window.auth = null;
    window.userId = null;
    window.studentList = [];
    window.classState = 'IDLE'; // 'IDLE', 'IN_CLASS'
    window.studentScores = {}; // { '學生姓名': score, ... }
    window.drawnStudent = null;
    window.scoreSnapshotUnsubscribe = null; // 用於取消 Firestore 訂閱

    // UI 元素
    const ui = {
        startBtn: document.getElementById('start-class-btn'),
        endBtn: document.getElementById('end-class-btn'),
        selectBtn: document.getElementById('select-student-btn'),
        addBtn: document.getElementById('add-score-btn'),
        minusBtn: document.getElementById('minus-score-btn'),
        fileInput: document.getElementById('file-input'),
        mainInterface: document.getElementById('main-interface'),
        studentCount: document.getElementById('student-count'),
        classStatusText: document.getElementById('class-status-text'),
        classStatusIcon: document.getElementById('class-status-icon'),
        currentStudent: document.getElementById('current-student'),
        currentScoreDisplay: document.getElementById('current-score-display'),
        scoresList: document.getElementById('scores-list'),
        messageBox: document.getElementById('message-box')
    };

    // --- Firebase & Auth 初始化 ---
    async function initializeFirebase() {
        if (firebaseConfig) {
            try {
                window.app = initializeApp(firebaseConfig);
                window.db = getFirestore(window.app);
                window.auth = getAuth(window.app);

                // 使用 custom token 登入，如果沒有則使用匿名登入
                if (initialAuthToken) {
                    await signInWithCustomToken(window.auth, initialAuthToken);
                } else {
                    await signInAnonymously(window.auth);
                }
                
                // 檢查登入狀態並設定 userId
                onAuthStateChanged(window.auth, (user) => {
                    if (user) {
                        window.userId = user.uid;
                        showMessage(`Firebase 登入成功。用戶 ID: ${window.userId.substring(0, 8)}...`, 'success');
                        // 初始狀態下，如果名單已載入，啟用「上課」按鈕
                        updateUI();
                    } else {
                        window.userId = crypto.randomUUID(); // 未登入時使用隨機 ID
                        showMessage("Firebase 登入失敗，使用匿名 ID。", 'error');
                    }
                });

            } catch (error) {
                console.error("Firebase 初始化或登入失敗:", error);
                showMessage("Firebase 錯誤：無法連接資料庫。", 'error');
            }
        } else {
            console.warn("Firebase Config 未提供。資料將不會被持久儲存。");
            showMessage("警告：Firebase Config 遺失，無法儲存分數。", 'warning');
        }
    }

    // --- Firestore 資料處理 ---

    /** 取得 Firestore 文件參考 */
    function getScoreDocRef() {
        if (!window.db || !window.userId) return null;
        // 私人路徑: /artifacts/{appId}/users/{userId}/classData/scores
        return doc(window.db, `artifacts/${appId}/users/${window.userId}/classData/scores`);
    }

    /**
     * 儲存當前分數到 Firestore
     * @param {Object} scores - 學生分數物件
     */
    async function saveScores(scores) {
        const docRef = getScoreDocRef();
        if (!docRef) return console.error("無法取得 Firestore 文件參考.");

        try {
            await setDoc(docRef, { scores: scores || {}, updatedAt: new Date() }, { merge: true });
            // showMessage("分數已自動儲存。", 'info'); // 避免過多訊息
        } catch (error) {
            console.error("儲存分數到 Firestore 失敗:", error);
            showMessage("錯誤：分數儲存失敗！", 'error');
        }
    }

    /** 訂閱 Firestore 即時分數更新 */
    function subscribeToScores() {
        if (window.scoreSnapshotUnsubscribe) {
            window.scoreSnapshotUnsubscribe(); // 取消舊的訂閱
        }

        const docRef = getScoreDocRef();
        if (!docRef) return;

        window.scoreSnapshotUnsubscribe = onSnapshot(docRef, (docSnap) => {
            if (docSnap.exists()) {
                const data = docSnap.data();
                if (data && data.scores) {
                    window.studentScores = data.scores;
                    renderScoresList();
                    // 更新當前被點名學生的分數顯示
                    if (window.drawnStudent) {
                        updateCurrentStudentScoreDisplay(window.studentScores[window.drawnStudent] || 0);
                    }
                }
            } else {
                window.studentScores = {};
                renderScoresList();
            }
        }, (error) => {
            console.error("Firestore 訂閱錯誤:", error);
            showMessage("錯誤：無法同步分數資料。", 'error');
        });
    }

    /**
     * 停止 Firestore 訂閱並清除分數
     */
    function stopScoreSubscription() {
        if (window.scoreSnapshotUnsubscribe) {
            window.scoreSnapshotUnsubscribe();
            window.scoreSnapshotUnsubscribe = null;
        }
        window.studentScores = {};
    }

    // --- 輔助函式 ---

    /**
     * 顯示浮動訊息
     * @param {string} message - 訊息內容
     * @param {'success'|'error'|'info'|'warning'} type - 訊息類型
     */
    function showMessage(message, type = 'info') {
        let bgColor, icon;
        switch (type) {
            case 'success':
                bgColor = 'bg-teal-500';
                icon = 'check-circle';
                break;
            case 'error':
                bgColor = 'bg-red-500';
                icon = 'x-circle';
                break;
            case 'warning':
                bgColor = 'bg-yellow-500';
                icon = 'alert-triangle';
                break;
            case 'info':
            default:
                bgColor = 'bg-blue-500';
                icon = 'info';
                break;
        }

        ui.messageBox.className = `fixed bottom-4 right-4 p-3 ${bgColor} text-white rounded-lg shadow-xl transition-opacity duration-300 opacity-100 flex items-center space-x-2`;
        ui.messageBox.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5"></i><span>${message}</span>`;
        ui.messageBox.classList.remove('hidden');
        lucide.createIcons(); // 重新渲染 icon

        setTimeout(() => {
            ui.messageBox.classList.remove('opacity-100');
            ui.messageBox.classList.add('opacity-0');
            setTimeout(() => {
                ui.messageBox.classList.add('hidden');
            }, 5000);
        }, 300);
    }

    // --- UI 渲染與更新 ---

    /** 更新主要介面的啟用狀態 */
    function updateUI() {
        const listReady = window.studentList.length > 0;
        const inClass = window.classState === 'IN_CLASS';
        const studentSelected = !!window.drawnStudent;
        const currentScore = window.studentScores[window.drawnStudent] || 0;

        // 控制上課/下課按鈕
        ui.startBtn.disabled = !listReady || inClass;
        ui.endBtn.disabled = !inClass;

        // 控制點名/加扣分按鈕
        ui.selectBtn.disabled = !inClass;
        ui.addBtn.disabled = !inClass || !studentSelected;
        // 只有當分數大於 0 時才能扣分
        ui.minusBtn.disabled = !inClass || !studentSelected || currentScore <= 0;

        // 控制主介面樣式
        ui.mainInterface.classList.toggle('opacity-50', !inClass);
        ui.mainInterface.classList.toggle('pointer-events-none', !inClass);

        // 更新狀態顯示
        ui.classStatusText.textContent = inClass ? '上課中' : '尚未開始上課';
        ui.classStatusIcon.innerHTML = inClass ? '<i data-lucide="bell" class="w-5 h-5 text-green-600"></i>' : '<i data-lucide="clock" class="w-5 h-5 text-gray-400"></i>';
        
        lucide.createIcons();
    }

    /** 更新當前學生分數顯示 */
    function updateCurrentStudentScoreDisplay(score) {
        ui.currentScoreDisplay.innerHTML = `目前分數: <span class="text-teal-600">${score}</span>`;
    }

    /** 渲染分數列表 */
    function renderScoresList() {
        const names = Object.keys(window.studentScores);
        ui.scoresList.innerHTML = ''; // 清空列表

        if (names.length === 0) {
            ui.scoresList.innerHTML = '<p class="text-gray-500 text-center text-sm p-3">本節課尚未有學生被點名或分數記錄。</p>';
            return;
        }

        // 按分數降序排列
        const sortedStudents = names.sort((a, b) => window.studentScores[b] - window.studentScores[a]);

        sortedStudents.forEach(name => {
            const score = window.studentScores[name];
            const item = document.createElement('div');
            item.className = 'flex justify-between items-center p-2 rounded-lg transition duration-150 ' + (name === window.drawnStudent ? 'bg-indigo-100 font-bold' : 'bg-white hover:bg-gray-100');
            
            item.innerHTML = `
                <span class="text-gray-700">${name}</span>
                <span class="text-lg font-mono px-3 py-1 rounded-full ${score > 0 ? 'bg-teal-100 text-teal-600' : (score < 0 ? 'bg-red-100 text-red-600' : 'bg-gray-200 text-gray-700')}">
                    ${score}
                </span>
            `;
            ui.scoresList.appendChild(item);
        });
    }


    // --- 核心功能函式 (掛載到 window) ---

    /**
     * 處理檔案上傳並使用 SheetJS 解析 XLSX 檔案
     * @param {Event} event - 檔案輸入事件
     */
    window.handleFileUpload = (event) => {
        const file = event.target.files[0];
        if (!file) return;

        // 檢查檔案類型，雖然 input 已經限制，但再次確認
        if (!file.name.endsWith('.xlsx')) {
            showMessage('錯誤：請上傳 .xlsx 格式的檔案。', 'error');
            return;
        }
        
        // 顯示載入狀態
        ui.studentCount.textContent = `正在讀取並解析 ${file.name}... 請稍候。`;
        ui.startBtn.disabled = true;

        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                // 1. 讀取二進位資料
                const data = new Uint8Array(e.target.result);
                // 2. 使用 SheetJS 解析 Workbook
                const workbook = XLSX.read(data, { type: 'array' });
                
                // 3. 取得第一個工作表
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                
                if (!worksheet) {
                     showMessage('錯誤：Excel 檔案中找不到任何工作表。', 'error');
                     return;
                }

                window.studentList = [];
                
                // 4. 核心邏輯：從第 4 行 (i=4) 開始，只讀取 B 欄
                // SheetJS 的 cell 索引是 1-based (從 1 開始)
                let i = 4; 
                
                // 檢查工作表的最大範圍，避免讀取太多空行
                const range = XLSX.utils.decode_range(worksheet['!ref'] || 'A1:A1');
                const maxRow = range.e.r + 1; // 結束行號 (0-based)

                while (i <= maxRow) {
                    const cellAddress = 'B' + i; // 確保只讀取 B 欄 (B4, B5, B6...)
                    const cell = worksheet[cellAddress];
                    
                    if (cell && cell.v) {
                        const studentName = String(cell.v).trim();
                        if (studentName) {
                            window.studentList.push(studentName);
                        }
                    } else if (i > 4 && !worksheet['A' + i] && !worksheet['C' + i]) {
                        // 如果 B 欄是空的，且左右兩欄 (A, C) 也都是空的，則假設資料結束。
                        break; 
                    }

                    i++;
                }

                ui.studentCount.textContent = `已載入 ${window.studentList.length} 位學生。`;
                if (window.studentList.length > 0) {
                    showMessage(`成功載入 ${window.studentList.length} 位學生名單！`, 'success');
                    ui.startBtn.disabled = false;
                } else {
                    // 這裡的錯誤訊息可以幫助使用者排查問題，故保留詳細描述
                    showMessage('錯誤：未能從 .xlsx 檔案的第一個工作表的 B 欄 (第 4 行開始) 讀取到學生姓名，請檢查檔案內容。', 'error');
                    ui.startBtn.disabled = true;
                }
            } catch (error) {
                console.error("解析 XLSX 檔案失敗:", error);
                showMessage('致命錯誤：無法解析您上傳的 Excel 檔案。請確認檔案沒有損壞或密碼保護。', 'error');
            }
            updateUI();
        };

        reader.onerror = () => {
            showMessage('讀取檔案時發生錯誤。', 'error');
        };

        // 以 ArrayBuffer 模式讀取檔案，這是 SheetJS 所需的格式
        reader.readAsArrayBuffer(file);
    };

    /** 開始上課 */
    window.startClass = async () => {
        if (window.studentList.length === 0) {
            showMessage('請先上傳學生名單！', 'warning');
            return;
        }

        window.classState = 'IN_CLASS';
        window.drawnStudent = null;
        ui.currentStudent.textContent = '準備點名...';

        // 清除舊分數並開始訂閱即時更新
        window.studentScores = {};
        if (window.db) {
            // 寫入空分數，清除 Firestore 舊紀錄
            await saveScores({});
            subscribeToScores(); 
        } else {
            // 無 Firestore 則僅更新 UI
            renderScoresList();
        }
        
        updateUI();
        showMessage('上課開始！已清除分數記錄並準備點名。', 'success');
    };

    /** 隨機抽取學生 */
    window.randomSelectStudent = () => {
        if (window.classState !== 'IN_CLASS') {
            showMessage('請先點擊「上課」按鈕開始。', 'warning');
            return;
        }
        
        if (window.studentList.length === 0) {
            showMessage('學生名單是空的！', 'error');
            return;
        }

        const randomIndex = Math.floor(Math.random() * window.studentList.length);
        window.drawnStudent = window.studentList[randomIndex];
        
        // 確保學生在分數追蹤物件中
        if (!(window.drawnStudent in window.studentScores)) {
            window.studentScores[window.drawnStudent] = 0;
        }

        const currentScore = window.studentScores[window.drawnStudent];
        ui.currentStudent.textContent = window.drawnStudent;
        updateCurrentStudentScoreDisplay(currentScore);
        
        showMessage(`抽中學生: ${window.drawnStudent}`, 'info');
        updateUI(); // 啟用加/扣分按鈕
    };

    /**
     * 更新當前被點名學生的分數
     * @param {number} amount - 分數變化量 (+1 或 -1)
     */
    window.updateScore = async (amount) => {
        if (!window.drawnStudent || window.classState !== 'IN_CLASS') {
            showMessage('請先點名學生！', 'warning');
            return;
        }

        let newScore = (window.studentScores[window.drawnStudent] || 0) + amount;
        
        // 下限為 0 分
        if (newScore < 0) {
            newScore = 0;
            showMessage('分數下限為 0 分。', 'warning');
        }

        window.studentScores[window.drawnStudent] = newScore;
        updateCurrentStudentScoreDisplay(newScore);

        // 即時儲存到 Firestore
        if (window.db) {
            await saveScores(window.studentScores);
        } else {
            // 無 Firestore 時手動更新列表
            renderScoresList();
        }
        
        showMessage(`已更新 ${window.drawnStudent} 的分數為 ${newScore}。`, amount > 0 ? 'success' : 'error');
        updateUI(); // 重新檢查扣分按鈕的禁用狀態
    };


    /** 下課並匯出分數報告 (改為匯出 XLSX 檔案) */
    window.endClass = () => {
        if (window.classState !== 'IN_CLASS') {
            showMessage('課程尚未開始。', 'warning');
            return;
        }

        // 1. 重設狀態和 UI
        window.classState = 'IDLE';
        window.drawnStudent = null;
        ui.currentStudent.textContent = '點名結束';
        updateCurrentStudentScoreDisplay(0);
        stopScoreSubscription(); // 停止 Firestore 訂閱

        // 2. 準備 XLSX 報告內容
        const names = Object.keys(window.studentScores);
        
        // 排序分數最高的在前
        const sortedNames = names.sort((a, b) => window.studentScores[b] - window.studentScores[a]);

        const dataForSheet = sortedNames.map(name => ({
            '學生姓名': name,
            '本節課分數': window.studentScores[name]
        }));

        if (dataForSheet.length === 0) {
             // 如果沒有分數紀錄，至少匯出一個包含標題的空檔案
             dataForSheet.push({ '學生姓名': '無紀錄', '本節課分數': 0 });
        }

        try {
            // 3. 建立 Worksheet 和 Workbook
            const ws = XLSX.utils.json_to_sheet(dataForSheet);
            const wb = XLSX.utils.book_new();
            
            // 添加一個標題行在最上方，說明報告時間 (可選)
            XLSX.utils.sheet_add_aoa(ws, [
                [`課堂分數報告 - ${new Date().toLocaleString('zh-TW', { hour12: false })}`]
            ], { origin: "A1" });
            
            // 由於加了一行標題，資料標題（'學生姓名', '本節課分數'）會自動移到第二行。
            
            XLSX.utils.book_append_sheet(wb, ws, "課堂分數報告");

            // 4. 寫入檔案並觸發下載
            const dateStr = new Date().toLocaleDateString('zh-TW').replace(/\//g, '-');
            const filename = `課堂分數報告_${dateStr}.xlsx`;
            XLSX.writeFile(wb, filename);

            showMessage('下課！分數報告已儲存為 Excel (.xlsx) 檔案。', 'success');

        } catch (e) {
            console.error("匯出 XLSX 檔案失敗:", e);
            showMessage('錯誤：匯出 Excel 檔案失敗！', 'error');
        }
        
        // 5. 確保 UI 重設
        window.studentScores = {};
        renderScoresList();
        updateUI();
    };

    // --- 啟動初始化 ---
    document.addEventListener('DOMContentLoaded', () => {
        initializeFirebase();
        // 確保 Lucide Icons 在頁面載入時正確顯示
        lucide.createIcons();
    });
</script>
