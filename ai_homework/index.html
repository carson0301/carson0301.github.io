<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>值日排班程式</title>
	<link rel="stylesheet" href="styles.css" />
</head>
<body>
	<canvas id="canvas-bg"></canvas>
	<div class="container">
		<h1>值日排班程式</h1>
		<div class="sub">- 依規則自動產生值日表、支援 .xlsx 匯入/匯出📄、避開請假與連班🚫、支援放假日與週末跳過🏖️。</div>

		<div class="grid">
			<!-- 名單與匯入 -->
			<div class="card" style="grid-column: span 12;">
				<h3>學生名單 👥</h3>
				<div class="row">
					<input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;" />
					<button id="chooseFileBtn" class="secondary">選擇檔案</button>
					<span id="fileName" class="small">未選擇檔案</span>
				</div>
				<div id="dropZone" class="drop-zone">
					<span>拖放 .xlsx 檔到這裡，或點擊「選擇檔案」</span>
				</div>
				<div id="importError" class="small" style="color:#c0392b; display:none;"></div>
				<div id="importPreview" class="small" style="display:none; margin-top:6px;"></div>
				<div class="small" style="margin-top:6px;">可直接貼上，用空格分隔每位同學；或上傳 .xlsx（只讀取 B 欄，忽略 B1、B2、B3、B25）。</div>
				<textarea id="studentsInput" placeholder="例如：王小明 李小美 陳大安 ...（以空格分隔）"></textarea>
				<div class="row">
					<span class="small" id="studentCount">目前 0 人</span>
				</div>
			</div>

			<!-- 排班設定 -->
			<div class="card" style="grid-column: span 12;">
				<h3>排班設定 ⚙️</h3>
				<div class="row" style="margin-bottom:8px;">
					<label>年級</label>
					<input type="text" id="gradeInput" placeholder="例如：高一" style="width:140px;" />
					<label>班別</label>
					<input type="text" id="classInput" placeholder="例如：甲" style="width:100px;" />
				</div>
				<div class="row" style="margin-bottom:8px;">
					<label>每日值日人數（1-3）</label>
					<input type="number" id="perDay" min="1" max="3" value="3" style="width:90px;" />
					<label>排班天數</label>
					<input type="number" id="days" min="1" max="31" value="5" style="width:90px;" />
					<button id="weekBtn" class="secondary">預排一週（5天）</button>
					<label><input type="checkbox" id="skipWeekends" checked /> 排除週末</label>
				</div>
				<div class="row" style="margin-bottom:8px;">
					<label>起始日期</label>
					<input type="date" id="startDate" />
					<button id="addHolidayBtn" class="secondary">新增放假日</button>
					<span class="small">（放假則不安排值日）</span>
				</div>
				<div id="holidays" class="row" style="gap:8px; margin-bottom:6px;"></div>
				<div class="row" style="margin-top:8px;">
					<label>今日請假名單（用空格分隔）</label>
				</div>
				<textarea id="absentToday" placeholder="例如：王小明 李小美"></textarea>
				<div class="row" style="margin-top:8px;">
					<label>之前請假且返校當日需安排值日</label>
				</div>
				<div class="row" id="returneesRow" style="gap:8px; flex-direction: column; align-items: stretch;">
					<div class="row">
						<input type="text" id="returneeName" placeholder="同學姓名（單一）" style="flex:1;" />
						<input type="date" id="returneeDate" />
						<button id="addReturnee" class="secondary">新增返校安排</button>
					</div>
					<div id="returneesList" class="row" style="flex-wrap: wrap; gap:8px;"></div>
				</div>
				<div class="row" style="margin-top:12px;">
					<button id="generateBtn">產生排班</button>
					<button id="exportBtn" class="secondary" disabled>匯出 PDF</button>
				</div>
			</div>

			<!-- 結果 -->
			<div class="card" style="grid-column: span 12;">
				<h3>排班結果 📋</h3>
				<div id="resultInfo" class="small"></div>
				<table class="table" id="resultTable">
					<thead>
						<tr>
							<th>日期</th>
							<th>星期</th>
							<th>值日生</th>
							<th>工作分配</th>
							<th>完成</th>
						</tr>
					</thead>
					<tbody></tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- 讀取/處理 Excel（供上傳 .xlsx 使用） -->
	<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

	<!-- 匯出 PDF 相關 CDN -->
	<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

	<!-- 主程式已移至 app.js -->
	<script src="app.js"></script>
</body>
</html>
