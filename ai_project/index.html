<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中醫舌苔智能識別系統</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* 設備選擇樣式 */
        .device-selection {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .selection-title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #333;
        }

        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .device-btn {
            background: #fff;
            border: 2px solid #ddd;
            border-radius: 15px;
            padding: 20px;
            width: 150px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .device-btn:hover {
            border-color: #007bff;
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .device-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .device-text {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .mobile-btn:hover {
            border-color: #28a745;
        }

        .pc-btn:hover {
            border-color: #007bff;
        }

        /* 響應式設計 */
        @media (max-width: 768px) {
            .button-container {
                flex-direction: column;
                align-items: center;
            }

            .device-btn {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="device-selection">
            <h2 class="selection-title">請選擇客戶端</h2>
            <div class="button-container">
                <button id="mobile-btn" class="device-btn mobile-btn">
                    <div class="device-icon phone-icon"></div>
                    <div class="device-text">移動端</div>
                </button>
                <button id="pc-btn" class="device-btn pc-btn">
                    <div class="device-icon computer-icon"></div>
                    <div class="device-text">PC端</div>
                </button>
            </div>
        </div>
    </div>

    <!-- 原本的腳本 -->
    <script src="js/router.js"></script>
    <script src="js/device-selection.js"></script>
</body>
</html>
